# Ground-truth query set for this repository.
#
# Each entry is a question with the file(s) that genuinely answer it. A query
# counts as answered when any expected file appears in the returned hits; the
# rank of that first correct hit drives MRR and recall@k.
#
# Rules that keep the set honest:
#   - `files` is where a person would actually look, not every file that
#     happens to contain the words. A set that accepts near-misses cannot
#     detect a ranking regression.
#   - Categories are load-bearing: they isolate which retrieval leg moved.
#     `symbol` leans on BM25's `name` field and the exact-symbol boost,
#     `semantic` on the dense leg and the cross-encoder, `docs` on the
#     heading chunker, `cross_cutting` on plain term matching.
#   - Nothing under a hidden directory (.github, .cargo): the walker sets
#     `hidden(true)`, so those files are never indexed and would be
#     permanent, meaningless misses.
#
# Note this set describes *this* repo. For another project, copy the shape
# and write its own — see eval/README.md.

# ---------------------------------------------------------------- symbol --
# Exact-identifier lookups: the queries that would otherwise send someone to
# grep. Regressions here point at the `name` field boost or `symbol_boost`.

[[query]]
q = "AdaptiveBatcher::note_failure"
category = "symbol"
files = ["src/adaptive_batcher.rs"]
symbol = "AdaptiveBatcher::note_failure"

[[query]]
q = "query_names_symbol"
category = "symbol"
files = ["src/search.rs"]
symbol = "query_names_symbol"

[[query]]
q = "fuse_rerank_votes"
category = "symbol"
files = ["src/search.rs"]
symbol = "fuse_rerank_votes"

[[query]]
