category = "symbol"
files = ["src/bm25.rs"]

[[query]]
q = "split_identifier"
category = "symbol"
files = ["src/bm25.rs"]
symbol = "split_identifier"

[[query]]
q = "PathFilter"
category = "symbol"
files = ["src/walker.rs"]

[[query]]
q = "chunk_uuid"
category = "symbol"
files = ["src/indexer.rs"]
symbol = "chunk_uuid"

[[query]]
q = "vanished_files"
category = "symbol"
files = ["src/watcher.rs"]
symbol = "vanished_files"

[[query]]
q = "config_hard_fingerprint"
category = "symbol"
files = ["src/vector_store.rs"]
symbol = "config_hard_fingerprint"

[[query]]
q = "SearchContext"
category = "symbol"
