# camelCase asked of a snake_case definition — the cross-style path through
# the code-aware tokenizer.
[[query]]
q = "queryNamesSymbol"
category = "symbol"
files = ["src/search.rs"]
symbol = "query_names_symbol"

# -------------------------------------------------------------- semantic --
# Natural-language questions with no literal identifier to latch onto. This
# is where the dense leg and the cross-encoder earn their cost.

[[query]]
q = "how dense and sparse results are merged into one ranking"
category = "semantic"
files = ["src/search.rs"]

[[query]]
q = "cancelling an in-flight tool call"
category = "semantic"
files = ["src/serve.rs"]

[[query]]
q = "deciding a file has not changed since the last index"
category = "semantic"
files = ["src/indexer.rs"]

[[query]]
q = "what happens when the reranker is unavailable"
category = "semantic"
files = ["src/search.rs"]

[[query]]
q = "splitting markdown on section headings"
category = "semantic"
files = ["src/chunker.rs"]

[[query]]
q = "skipping binary files without reading them"
category = "semantic"
files = ["src/walker.rs", "src/indexer.rs"]

[[query]]
q = "reading the index without taking the write lock"
category = "semantic"
files = ["src/bm25.rs"]

[[query]]
q = "what makes the collection get wiped and rebuilt"
category = "semantic"
files = ["src/vector_store.rs", "src/indexer.rs"]

[[query]]
q = "debouncing filesystem events before reindexing"
category = "semantic"
files = ["src/watcher.rs"]

[[query]]
q = "reusing stored vectors for chunks that did not change"
category = "semantic"
# The decision lives in indexer.rs, the fetch that makes it possible in
# vector_store.rs::fetch_file_vectors — whose doc comment explains the whole
# mechanism. Landing in either answers the question, so listing only one
# would make the set wrong rather than strict.
files = ["src/indexer.rs", "src/vector_store.rs"]

[[query]]
q = "growing and shrinking the embedding batch size"
category = "semantic"
files = ["src/adaptive_batcher.rs"]

[[query]]
q = "returning the full text of a chunk instead of a preview"
category = "semantic"
files = ["src/serve.rs", "src/bm25.rs"]

# ------------------------------------------------------------------ docs --
# Prose lookups. Exercises the heading chunker and, indirectly, whether docs
# can compete with code for the same words.

[[query]]
q = "changelog entry about the code-aware tokenizer"
category = "docs"
files = ["docs/CHANGELOG.md"]

[[query]]
q = "wiring the server into Claude Code"
category = "docs"
files = ["README.md"]

[[query]]
q = "docker compose for the development stack"
category = "docs"
files = ["CONTRIBUTING.md", "README.md"]

[[query]]
q = "per language chunking strategy reference config"
category = "docs"
files = ["examples/full-config.toml"]

[[query]]
q = "how to add support for a new language"
category = "docs"
files = ["CONTRIBUTING.md"]

# --------------------------------------------------------- cross_cutting --
# Terms that appear in several places; the question is whether the *right*
# place ranks first.

[[query]]
q = "minimum supported rust version"
category = "cross_cutting"
files = ["Cargo.toml", "CONTRIBUTING.md", "README.md"]

[[query]]
q = "stdout is reserved for JSON-RPC framing"
category = "cross_cutting"
files = ["src/serve.rs", "src/main.rs"]

[[query]]
q = "reciprocal rank fusion constant default 60"
category = "cross_cutting"
files = ["src/search.rs", "src/config.rs"]

[[query]]
q = "query log written by the serve command"
category = "cross_cutting"
files = ["src/serve.rs", "src/config.rs"]
