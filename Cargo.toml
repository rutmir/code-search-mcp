[package]
name = "code-search-mcp"
version = "0.0.1"
edition = "2021"
description = "MCP server for hybrid code retrieval (BM25 + dense + LSP). A/B candidate vs Claude Code Explore agent."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "code-search-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shellexpand = "3"
tantivy = "0.22"
toml = "0.8"
tree-sitter = "0.22"
tree-sitter-c-sharp = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-dart = "0.0.4"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "signal", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
