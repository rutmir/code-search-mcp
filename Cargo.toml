[package]
name = "code-search-mcp"
version = "0.0.9"
edition = "2021"
# Highest MSRV in the dependency tree (`time` 0.3 family as of 2026-06).
# Verify with: cargo metadata | jq '.packages[].rust_version' | sort -V
rust-version = "1.88"
description = "Token-saving MCP server for hybrid code search: tree-sitter chunking + BM25 + dense embeddings + cross-encoder rerank"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "code-search-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shellexpand = "3"
tantivy = "0.22"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "signal", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
