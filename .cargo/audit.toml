# cargo-audit configuration. Lives here (not only in CI) so `cargo audit`
# run locally and the CI job agree on what is and isn't accepted.

[advisories]
# Each entry is a deliberate, temporary acceptance — not a way to keep the
# job green. Record why the advisory can't be acted on and what unblocks it.
#
# Currently empty. RUSTSEC-2025-0009 (ring <0.17.12) lived here because
# `ring` needed a `cc` newer than 1.0.x while `tree-sitter-javascript
# 0.21.4` pinned `cc = "~1.0.90"`. The tree-sitter upgrade lifted that pin,
# `ring` moved to 0.17.14 on its own, and the entry was removed rather than
# left to rot — an ignore list nobody prunes stops being a record of
# decisions and becomes a place advisories go to be forgotten.
ignore = []
